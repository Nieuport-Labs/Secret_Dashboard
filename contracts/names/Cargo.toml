[package]
name = "secret-dashboard-names"
version = "0.1.0"
edition = "2021"
description = "Private name registry for Secret Dashboard: a name is an account, and it never resolves to an address."

[lib]
crate-type = ["cdylib", "rlib"]

# Same build settings as `contracts/profile`. `panic = 'abort'` matters most:
# unwinding is not available in the enclave, and a contract built without it
# fails at upload rather than at runtime, which is a confusing place to find out.
[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
# `random` is what exposes the enclave's own randomness as `env.block.random`,
# which the delayed write buffer draws its slot from. Without it the buffer
# falls back to block height and time, which is weaker than it should be.
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11", features = ["random"] }
cosmwasm-storage = { package = "secret-cosmwasm-storage", version = "1.1.11" }
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
sha2 = { version = "0.10.8", default-features = false }
thiserror = "1.0.57"

# Signing, so the tests can produce a signature the contract will actually
# accept. Pure Rust on purpose: the `secp256k1` bindings need a C toolchain,
# which is one more thing to be broken on a machine that only wants to run
# `cargo test`.
[dev-dependencies]
k256 = { version = "0.13.3", default-features = false, features = ["ecdsa", "std"] }
