[package]
name = "secret-dashboard-profile"
version = "0.1.0"
edition = "2021"
description = "Public profile registry for Secret Dashboard: one profile per account, readable by anyone who knows the address."

[lib]
crate-type = ["cdylib", "rlib"]

# The settings a Secret contract is built with. `panic = 'abort'` matters most:
# unwinding is not available in the enclave, and a contract built without it
# fails at upload rather than at runtime, which is a confusing place to find out.
[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11" }
cosmwasm-storage = { package = "secret-cosmwasm-storage", version = "1.1.11" }
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = "1.0.57"
