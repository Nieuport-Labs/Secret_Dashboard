<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Secret Dashboard</title>
    <meta
      name="description"
      content="An entry point into Secret Network — wallet, bridge, staking and the Secret dApp ecosystem."
    />

    <!--
      Link previews. `middleware.ts` rewrites everything between the OG:START
      and OG:END markers below, per URL, for requests carrying a known
      crawler's user agent — a proposal gets its own title and a rendered card
      naming it, a profile shows the address it belongs to. `api/og.tsx` draws
      the image both this static fallback and the middleware point at.

      What ships here is what anything else sees: a real browser (which never
      reads these tags — its own JS sets the tab title) or an unrecognised
      bot. Kept as a complete, valid card in its own right — same site-wide
      image, generic copy — rather than something that only works once
      middleware has run.
    -->
    <!--OG:START-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Secret Dashboard" />
    <meta property="og:title" content="Secret Dashboard" />
    <meta
      property="og:description"
      content="An entry point into Secret Network — wallet, bridge, staking and the Secret dApp ecosystem."
    />
    <meta property="og:image" content="https://secret-dashboard-mocha.vercel.app/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secret Dashboard" />
    <meta name="twitter:image" content="https://secret-dashboard-mocha.vercel.app/api/og" />
    <meta
      name="twitter:description"
      content="An entry point into Secret Network — wallet, bridge, staking and the Secret dApp ecosystem."
    />
    <!--OG:END-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
